<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MONSTER BINGO 管理</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* 運営用：PCでもスマホでも使える1カラム＋タブの管理画面 */
:root {
  --night: #0b0a10; --night-2: #12101a; --night-3: #1b1826; --night-4: #262236; --line: rgba(255,255,255,.1);
  --text: #f6f3ff; --muted: rgba(246,243,255,.62); --faint: rgba(246,243,255,.42);
  --pumpkin: #ff7a1a; --pumpkin-soft: #ffb870; --witch: #ae7bff; --good: #6ee7a1; --warn: #fcd34d; --bad: #ff9a9a;
  --font-display: "Dela Gothic One", "Hiragino Sans", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--text); font: 500 14px var(--font-body); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--pumpkin-soft); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 80px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: linear-gradient(160deg, rgba(52,48,74,.7), rgba(18,16,26,.9)); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.muted { color: var(--muted); } .faint { color: var(--faint); font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=search], select {
  border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(11,10,16,.6); padding: 9px 12px; min-width: 0; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; background: var(--pumpkin); color: var(--night); }
.btn:disabled { opacity: .4; }
.btn-ghost { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); border-radius: 12px; padding: 9px 14px; font-weight: 800; }
.btn-danger { border: 1px solid rgba(255,154,154,.4); background: none; color: var(--bad); border-radius: 12px; padding: 9px 14px; font-weight: 800; }
.link { background: none; border: 0; padding: 0; text-decoration: underline; font-weight: 800; font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile .v { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 13px; color: var(--faint); margin-left: 4px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--pumpkin-soft); border-color: var(--pumpkin); }
.status { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; }
.status.draft { background: rgba(174,123,255,.2); color: var(--witch); }
.status.active { background: rgba(110,231,161,.18); color: var(--good); }
.status.ended { background: rgba(255,255,255,.1); color: var(--muted); }
.count { border-radius: 999px; background: #e5484d; color: #fff; font-size: 10px; padding: 0 6px; margin-left: 4px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; color: var(--faint); padding: 8px; font-weight: 800; }
td { padding: 8px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar-row { display: grid; grid-template-columns: 26px 120px 1fr 36px; gap: 8px; align-items: center; }
.bar { height: 12px; border-radius: 999px; background: var(--night); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; }
.people { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow-y: auto; }
.people div { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.05); }
.radio { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.05); cursor: pointer; }
.radio input { margin-top: 3px; accent-color: var(--pumpkin); }
.monster-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; }
.monster-row.inactive { opacity: .5; }
.qr { background: #fff; border-radius: 12px; padding: 8px; width: 220px; max-width: 100%; }
.qr svg { display: block; width: 100%; height: auto; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--night-4); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; font-weight: 800; z-index: 20; max-width: calc(100% - 32px); }
.error { color: var(--bad); font-weight: 800; }
.modal { position: fixed; inset: 0; background: rgba(11,10,16,.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.modal .panel { max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 32px); overflow-y: auto; }
.modal label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 800; }
textarea { font: inherit; color: inherit; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: rgba(11,10,16,.6); padding: 9px 12px; width: 100%; resize: vertical; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid rgba(255,255,255,.16); background: none; border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 12px; color: var(--muted); }
.chips button[aria-pressed=true] { background: var(--pumpkin); border-color: var(--pumpkin); color: var(--night); }
tr.absent td { opacity: .45; }
.tag { display: inline-block; border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 800; }
.tag.in { background: rgba(110,231,161,.18); color: var(--good); }
.tag.wait { background: rgba(255,255,255,.08); color: var(--muted); }
.tag.absent { background: rgba(255,154,154,.18); color: var(--bad); }
.tag.line { background: rgba(6,199,85,.2); color: #5ee38f; }
.pool-warn { border-color: rgba(252,211,77,.55); box-shadow: 0 0 0 1px rgba(252,211,77,.25) inset; }
.pool-warn .warn-text { color: var(--warn); font-weight: 800; }
.bar-row.unused { opacity: .35; }
.banner-pause { background: rgba(252,211,77,.14); border: 1px solid rgba(252,211,77,.4); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-weight: 800; }
details.panel summary { cursor: pointer; font-weight: 800; }
.announce-item { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.05); }

/* ---- 受付カードの印刷（91×55mm を A4 に 2列×5段）。紙は白黒前提なので、画面の配色は使わない */
#printSheet { display: none; }
.print-preview { position: fixed; inset: 0; z-index: 40; background: rgba(11,10,16,.92); overflow-y: auto; overflow-x: hidden; padding: 16px; }
.print-preview .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--night-3); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 auto 16px; max-width: 820px; }
.print-preview .sheet-page { background: #fff; margin: 0 auto 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.sheet-page { width: 210mm; height: 297mm; position: relative; overflow: hidden; color: #000; font-family: "Hiragino Sans", "M PLUS Rounded 1c", sans-serif; }
.card91 { position: absolute; width: 91mm; height: 55mm; box-sizing: border-box; border: 0.2mm dashed #999; padding: 4mm; display: flex; gap: 3.5mm; align-items: center; }
.card91 .qrp { width: 36mm; height: 36mm; flex-shrink: 0; }
.card91 .qrp svg { width: 100%; height: 100%; display: block; }
.card91 .qrp svg rect[fill="white"], .card91 .qrp svg path { shape-rendering: crispEdges; }
.card91 .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.8mm; }
.card91 .brand { font-family: "Dela Gothic One", sans-serif; font-size: 7.5pt; letter-spacing: .04em; }
.card91 .ev { font-size: 6pt; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card91 .nick { font-size: 13pt; font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card91 .aff { font-size: 6.5pt; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1em; }
.card91 .creds { display: flex; gap: 2.5mm; margin-top: 1mm; }
.card91 .creds div { border: 0.3mm solid #000; border-radius: 1.5mm; padding: 0.6mm 1.8mm; }
.card91 .creds small { display: block; font-size: 5pt; color: #444; }
.card91 .creds b { font-family: "Dela Gothic One", monospace; font-size: 11pt; letter-spacing: .08em; }
.card91 .how { font-size: 5.4pt; line-height: 1.45; color: #222; margin-top: 1mm; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  body { background: #fff !important; }
  body > *:not(#printSheet) { display: none !important; }
  #printSheet { display: block !important; }
  #printSheet .sheet-page { page-break-after: always; break-after: page; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="printSheet" aria-hidden="true"></div>
<script>
(function () {
  'use strict';
  const CONFIG = window.MONSTER_BINGO_CONFIG || {};
  const TOKEN_KEY = 'mb_admin_token';
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, remove: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
  const participantAppUrl = () => new URL('./', location.href).href;
  const ROLE = { guest: '参加者', staff: 'スタッフ', organizer: '主催者', sponsor: 'スポンサー', vip: 'ゲスト' };
  const RARITY = { normal: '通常', rare: 'RARE', secret: 'SECRET' };
  const STATUS = { draft: '準備中', active: '開催中', ended: '終了' };
  const FRAUD = { SELF_SCAN: '自分のQRを読み込もうとした', INVALID_TOKEN: '無効なQRを読み込んだ', RAPID_SCANS: '1分間に大量の交換', QR_SHARED_SUSPECT: '短時間に多数から読まれた（QRスクショ共有の疑い）', PIN_LOCKED: '番号＋PINの入力ミスが続いてロック' };
  const time = (t) => new Date(t).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  async function rpc(fn, args) {
    const response = await fetch(`${CONFIG.supabaseUrl.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json', apikey: CONFIG.supabaseAnonKey },
        // 旧形式の anon キー（JWT）の時だけ Authorization も付ける。新形式の Publishable key は apikey だけで通る
        /^eyJ/.test(CONFIG.supabaseAnonKey) ? { Authorization: `Bearer ${CONFIG.supabaseAnonKey}` } : {}),
      body: JSON.stringify(args || {}),
    });
    const body = await response.json().catch(() => null);
    if (!response.ok) {
      if (body && body.hint === 'ADMIN_REQUIRED') { store.remove(TOKEN_KEY); renderLogin('ログインの有効期限が切れました'); }
      const error = new Error((body && body.message) || '通信に失敗しました');
      error.hint = body && body.hint;
      throw error;
    }
    return body;
  }
  const admin = (fn, args) => rpc(fn, Object.assign({ p_admin_token: store.get(TOKEN_KEY) }, args || {}));

  let toastTimer;
  function toast(message) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = message; document.body.appendChild(el);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3000);
  }
  async function run(action, success) {
    try { const result = await action(); if (success) toast(success); return result; } catch (error) { if (error.hint !== 'ADMIN_REQUIRED') toast('⚠️ ' + error.message); return null; }
  }
  // 誤り訂正は M。Q/H にすると同じ大きさでも升目が細かくなり、薄いコピーやピンぼけで読めなくなりやすい
  //   （tests/print-check.mjs で300dpiに刷り直した画像を読んで確かめている）
  function qrSvg(text, level) {
    const qr = window.qrcode(0, level || 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 6, margin: level ? 2 : 1, scalable: true });
  }
  // 画面の上に重ねる小窓。開いている間は自動更新で中身を作り直さない（入力中の文字が消えないように）
  function modal(html) {
    const el = document.createElement('div');
    el.className = 'modal'; el.setAttribute('role', 'dialog');
    el.innerHTML = `<div class="panel">${html}</div>`;
    el.addEventListener('click', (e) => { if (e.target === el) el.remove(); });
    document.body.appendChild(el);
    return el;
  }
  // 入力中・小窓表示中は自動更新で画面を作り直さない
  const userIsBusy = () => {
    if (document.querySelector('.modal, .print-preview')) return true;
    const a = document.activeElement;
    return Boolean(a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById('app').contains(a));
  };

  // ---------------------------------------------------------------- ログイン
  function renderLogin(message) {
    stopPolling();
    app.innerHTML = `
      <div style="max-width:380px;margin:10vh auto 0;width:100%;display:flex;flex-direction:column;gap:16px">
        <h1 class="display" style="font-size:28px"><span style="color:var(--pumpkin)">ADMIN</span> LOGIN</h1>
        <p class="muted">MONSTER BINGO 運営管理</p>
        <form class="panel" id="login" style="display:flex;flex-direction:column;gap:10px">
          <input type="email" id="email" placeholder="メールアドレス" autocomplete="username" required>
          <input type="password" id="password" placeholder="パスワード" autocomplete="current-password" required>
          <p class="error" id="loginError" ${message ? '' : 'hidden'}>${esc(message || '')}</p>
          <button class="btn">ログイン</button>
        </form>
      </div>`;
    document.getElementById('login').onsubmit = async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('loginError');
      try {
        const result = await rpc('mb_admin_login', { p_email: document.getElementById('email').value, p_password: document.getElementById('password').value });
        if (!result.ok) { errorBox.hidden = false; errorBox.textContent = result.message; return; }
        store.set(TOKEN_KEY, result.token);
        renderEventList();
      } catch (error) { errorBox.hidden = false; errorBox.textContent = error.message; }
    };
  }

  // ---------------------------------------------------------------- イベント一覧
  async function renderEventList() {
    stopPolling();
    app.innerHTML = '<p class="muted">読み込み中…</p>';
    const events = await admin('mb_admin_events');
    app.innerHTML = `
      <div class="row"><h1 class="display grow" style="font-size:26px"><span style="color:var(--pumpkin)">MONSTER BINGO</span> ADMIN</h1><button class="link" id="logout">ログアウト</button></div>
      <form class="panel row" id="create">
        <input type="text" id="eventName" placeholder="イベント名（例：HALLOWEEN NIGHT 2026）" class="grow" style="min-width:220px" required>
        <input type="text" id="eventCode" placeholder="コード（空欄で自動）" style="width:180px;text-transform:uppercase">
        <button class="btn">＋ イベント作成</button>
        <p class="faint" style="width:100%">作成すると定番モンスター24体が自動で登録されます（あとから編集可）。</p>
      </form>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${events.map((e) => `<div class="row" style="gap:8px;flex-wrap:nowrap"><button class="panel row grow" data-open="${e.id}" style="text-align:left;cursor:pointer;padding:14px">
          <span class="status ${e.status}">${STATUS[e.status]}</span><span class="grow" style="font-weight:800">${esc(e.name)}</span>
          <span style="font-family:monospace;color:var(--pumpkin-soft)">${esc(e.code)}</span><span class="muted">${e.participant_count}人</span></button>
          <button class="btn-danger" data-delete-event="${e.id}" aria-label="${esc(e.name)} を削除" title="削除" style="align-self:stretch">🗑</button></div>`).join('') || '<p class="faint" style="text-align:center">まだイベントがありません</p>'}
      </div>`;
    document.getElementById('logout').onclick = async () => { await admin('mb_admin_logout').catch(() => {}); store.remove(TOKEN_KEY); renderLogin(); };
    document.getElementById('create').onsubmit = async (e) => {
      e.preventDefault();
      await run(() => admin('mb_admin_create_event', { p_name: document.getElementById('eventName').value, p_code: document.getElementById('eventCode').value || null }), 'イベントを作成しました');
      renderEventList();
    };
    app.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => openEvent(b.dataset.open).catch((e) => toast('⚠️ ' + e.message))));
    app.querySelectorAll('[data-delete-event]').forEach((b) => (b.onclick = () => deleteEvent(events.find((e) => e.id === b.dataset.deleteEvent))));
  }

  // イベントの削除。参加者・交換履歴などもすべて消え、元に戻せないので、イベントコードの入力で確認する
  function deleteEvent(e) {
    if (!e) return;
    const el = modal(`
      <h2 class="display" style="font-size:18px;color:var(--bad)">イベントを削除</h2>
      <p><b>${esc(e.name)}</b>（<span style="font-family:monospace">${esc(e.code)}</span>）</p>
      <p class="muted">参加者 ${e.participant_count}人のデータ、カード・交換履歴・お知らせ・モンスター設定もすべて消えます。<b>元に戻せません。</b>必要なら先に「参加者データCSV」を保存してください。</p>
      ${e.status === 'active' ? '<p class="error">⚠️ このイベントは開催中です。参加者の画面も使えなくなります。</p>' : ''}
      <label class="field">確認のため、イベントコード <span style="font-family:monospace">${esc(e.code)}</span> を入力<input type="text" id="confirmCode" autocomplete="off" style="text-transform:uppercase"></label>
      <div class="row"><button class="btn-ghost grow" id="cancelDelete">やめる</button><button class="btn-danger grow" id="doDelete" disabled>削除する</button></div>`);
    const input = el.querySelector('#confirmCode');
    const go = el.querySelector('#doDelete');
    input.oninput = () => { go.disabled = input.value.trim().toUpperCase() !== String(e.code).toUpperCase(); };
    el.querySelector('#cancelDelete').onclick = () => el.remove();
    go.onclick = async () => {
      go.disabled = true;
      const done = await run(() => admin('mb_admin_delete_event', { p_event_id: e.id, p_confirm_code: input.value }), `「${e.name}」を削除しました`);
      if (done) { el.remove(); renderEventList(); } else { go.disabled = false; }
    };
    input.focus();
  }

  // ---------------------------------------------------------------- イベント詳細
  let current = { eventId: null, tab: 'dashboard', dashboard: null, participants: null };
  let pollTimer = null;
  const stopPolling = () => { clearInterval(pollTimer); pollTimer = null; };

  async function openEvent(eventId) {
    current = { eventId, tab: 'dashboard', dashboard: null, participants: null };
    await loadDashboard();
    renderEvent();
    stopPolling();
    pollTimer = setInterval(async () => {
      if (document.visibilityState !== 'visible' || userIsBusy()) return;
      try {
        // 取りに行っている間に入力を始めることがあるので、描き直す直前にもう一度確かめる
        if (current.tab === 'dashboard') { await loadDashboard(); if (!userIsBusy()) await renderTab(); }
        if (current.tab === 'encounters' || current.tab === 'fraud') await renderTab();
      } catch (e) { /* 通信が不安定でも次の更新で取り直す */ }
    }, 5000);
  }
  async function loadDashboard() { current.dashboard = await admin('mb_admin_dashboard', { p_event_id: current.eventId }); }
  const ev = () => current.dashboard.event;

  function renderEvent() {
    const e = ev();
    const tabs = [['dashboard', 'ダッシュボード'], ['settings', '設定'], ['monsters', 'モンスター'], ['participants', '参加者'], ['encounters', '交換履歴'], ['fraud', '不正ログ']];
    app.innerHTML = `
      <button class="link" id="back" style="align-self:flex-start">← イベント一覧</button>
      <div class="row">
        <h1 class="display grow" style="font-size:22px">${esc(e.name)} <span style="font-family:monospace;font-size:14px;color:var(--pumpkin-soft)">${esc(e.code)}</span></h1>
        <span class="status ${e.status}">${STATUS[e.status]}</span>
        ${e.status === 'active' ? `<button class="btn-ghost" id="pause">${e.exchange_paused ? '▶ 交換を再開' : '⏸ 交換を一時停止'}</button>` : ''}
        ${e.status !== 'active' ? '<button class="btn" id="start">▶ イベント開始</button>' : '<button class="btn-ghost" id="end">■ 終了</button>'}
      </div>
      ${e.status === 'active' && e.exchange_paused ? '<p class="banner-pause">⏸ 交換を一時停止中です。参加者の画面にも「お休み中」と出ています（イベントの状態は開催中のまま）</p>' : ''}
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${current.tab === k}">${l}${k === 'fraud' && current.dashboard.totals.fraudLogs ? `<span class="count">${current.dashboard.totals.fraudLogs}</span>` : ''}</button>`).join('')}</div>
      <section id="tab"></section>`;
    document.getElementById('back').onclick = renderEventList;
    const setStatus = async (status) => { await run(() => admin('mb_admin_update_event', { p_event_id: current.eventId, p_patch: { status } }), '状態を変更しました'); await loadDashboard(); renderEvent(); };
    const startButton = document.getElementById('start');
    if (startButton) startButton.onclick = () => setStatus('active');
    const pauseButton = document.getElementById('pause');
    if (pauseButton) pauseButton.onclick = async () => {
      await run(() => admin('mb_admin_update_event', { p_event_id: current.eventId, p_patch: { exchange_paused: !e.exchange_paused } }), e.exchange_paused ? '交換を再開しました' : '交換を一時停止しました');
      await loadDashboard(); renderEvent();
    };
    const endButton = document.getElementById('end');
    if (endButton) endButton.onclick = () => { if (confirm('イベントを終了しますか？（交換できなくなります）')) setStatus('ended'); };
    app.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { current.tab = b.dataset.tab; renderEvent(); }));
    renderTab();
  }

  // ---- 使うモンスター（当日の人数に合わせる）
  //   来場者がモンスターの種類より少ないと、カードに載っているのに会場の誰も持っていないモンスターが出て、そのマスは永遠に開かない。
  //   種類数を人数以下にすると、配布もカードもその中だけになり、全員がビンゴ（カード完成）までたどり着ける
  function poolPanel(p) {
    const warn = p.present > 0 && p.unheld.length > 0;
    const value = p.poolSize || p.recommended || p.normalTotal;
    return `<div class="panel ${warn ? 'pool-warn' : ''}" id="poolPanel" style="display:flex;flex-direction:column;gap:10px">
      <h2 class="display" style="font-size:16px">🎯 使うモンスター（当日の人数に合わせる）</h2>
      <p>${p.poolSize ? `<b>${p.poolSize}種類に制限中</b>（カードに載るのは RARE を含め ${p.inPlay} 種類）` : `<b>制限なし</b>（通常モンスター全 ${p.normalTotal} 種類）`}
        ・ 当日いる人 <b>${p.present}人</b>${p.recommended ? ` → おすすめ <b>${p.recommended}種類</b>` : ''}</p>
      ${warn ? `<p class="warn-text">⚠️ カードに載っているのに、会場の誰も持っていないモンスターが ${p.unheld.length} 種類あります。そのマスは開かず、ビンゴできない人が出ます：${p.unheld.slice(0, 12).map((m) => `${esc(m.emoji)}${esc(m.name)}`).join('、')}${p.unheld.length > 12 ? ' ほか' : ''}</p>`
        : p.present > 0 ? '<p style="color:var(--good);font-weight:800">✓ カードのモンスターは、全部会場の誰かが持っています</p>' : '<p class="faint">受付が始まると、会場にいる人数から判定します</p>'}
      <div class="row">
        ${p.recommended ? `<button type="button" class="btn" id="poolFit">来場人数に合わせる（${p.recommended}種類）</button>` : ''}
        <label class="row" style="gap:6px"><input type="number" id="poolSize" min="1" max="${p.normalTotal}" value="${value}" style="width:80px" aria-label="使う種類数"> 種類</label>
        <button type="button" class="btn-ghost" id="poolSet">この種類数にする</button>
        ${p.poolSize ? '<button type="button" class="btn-ghost" id="poolOff">制限を外す</button>' : ''}
      </div>
      <p class="faint">まだ一度も交換していない人のモンスターと、全員のカードの「まだ開いていないマス」だけを差し替えます。開いたマス・ビンゴ数はそのまま。受付が落ち着いた開始前に押すのがおすすめです（途中で人が増減した時も、押し直せば整えます）。</p>
    </div>`;
  }
  function bindPoolPanel(p) {
    const apply = async (size) => {
      const message = size == null
        ? '使うモンスターの制限を外して、全種類に戻しますか？\n（すでに配ったカードはそのまま。これから参加する人から全種類になります）'
        : `使うモンスターを ${size} 種類にします。\n\n・まだ交換していない人のモンスターを、使うモンスターに配り直します\n・全員のカードの「まだ開いていないマス」を、使うモンスターに差し替えます\n（開いたマス・ビンゴ数・交換の履歴はそのままです）`;
      if (!confirm(message)) return;
      const r = await run(() => admin('mb_admin_set_monster_pool', { p_event_id: current.eventId, p_size: size }));
      if (r) toast(size == null ? '制限を外しました（全種類）' : `${r.poolSize}種類にしました（配り直し ${r.reassigned}人・カード ${r.cardsChanged}枚を調整）`);
      await loadDashboard(); renderTab();
    };
    const fit = document.getElementById('poolFit');
    if (fit) fit.onclick = () => apply(p.recommended);
    document.getElementById('poolSet').onclick = () => {
      const n = Number(document.getElementById('poolSize').value);
      if (!Number.isInteger(n) || n < 1) return toast('⚠️ 1以上の数を入れてください');
      if (p.present > 0 && n > p.present && !confirm(`当日いる人（${p.present}人）より多い ${n} 種類にすると、誰も持っていないモンスターが出てビンゴできない人が出ます。それでも進めますか？`)) return;
      apply(n);
    };
    const off = document.getElementById('poolOff');
    if (off) off.onclick = () => apply(null);
  }

  async function downloadCsv() {
    const rows = await admin('mb_admin_participants', { p_event_id: current.eventId });
    const total = current.dashboard.speciesTotal || 1;
    const cell = (v) => { let s = v == null ? '' : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const header = ['No', 'ニックネーム', '所属', '役割', '入場', '欠席', 'LINEで参加', '担当モンスター', 'レア度', '交流人数', '発見種類', 'コンプリート率(%)', 'BINGOライン', 'OPENマス', '初BINGO', 'カード完成', '登録日時'];
    const lines = rows.map((r) => [r.entry_no, r.nickname, r.affiliation || '', ROLE[r.role], r.checked_in_at || '', r.absent_at ? '欠席' : '', r.via_line ? 'LINE' : '', r.monster_name, r.monster_rarity, r.encounter_people, r.species_found, Math.round(r.species_found / total * 100), r.bingo_lines, r.opened_cells, r.first_bingo_at || '', r.completed_at || '', r.created_at].map(cell).join(','));
    const blob = new Blob(['﻿' + [header.join(','), ...lines].join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `monster-bingo-${ev().code}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  // ---- モンスター

    document.getElementById('addMonster').onsubmit = async (e) => {
      e.preventDefault();
      await run(() => admin('mb_admin_save_monster', { p_event_id: current.eventId, p_monster_id: null, p_data: { emoji: document.getElementById('newEmoji').value, name: document.getElementById('newName').value, color: document.getElementById('newColor').value, rarity: document.getElementById('newRarity').value } }), 'モンスターを追加しました');
      await loadDashboard(); renderTab();
    };
    box.querySelectorAll('[data-monster]').forEach((form) => (form.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      await run(() => admin('mb_admin_save_monster', { p_event_id: current.eventId, p_monster_id: f.dataset.monster, p_data: { emoji: field(f, 'emoji').value, name: field(f, 'name').value, color: field(f, 'color').value, rarity: field(f, 'rarity').value, image_url: field(f, 'image_url').value, is_active: field(f, 'is_active').checked } }), '保存しました');
      await loadDashboard(); renderTab();
    }));
    box.querySelectorAll('[data-delete]').forEach((b) => (b.onclick = async () => {
      if (!confirm('削除しますか？（使用中のモンスターは無効化のみ）')) return;
      const r = await run(() => admin('mb_admin_delete_monster', { p_event_id: current.eventId, p_monster_id: b.dataset.delete }));
      if (!r) return;
      toast(r.result === 'deleted' ? '削除しました' : '使用中のため無効化しました');
      await loadDashboard(); renderTab();
    }));
  }

  // ---- 参加者
  // 一覧は最初30人だけ描き「さらに表示」で足す。
  //   全員分を1度に描くと、行ごとのセレクトボックスまで含めて数千要素になり、操作のたびに画面が固まる
  //   （別アプリの本番で128行・約7,900要素、クリックごとに約1秒固まった）。編集は行ではなく小窓で行う。
  const PAGE = 30;
  const list = { rows: [], q: '', filter: 'all', limit: PAGE };
  const FILTERS = [
    ['all', '全員', () => true],
    ['in', '入場済み', (r) => r.checked_in_at && !r.absent_at],
    ['wait', '未入場', (r) => !r.checked_in_at && !r.absent_at],
    ['absent', '欠席', (r) => r.absent_at],
    ['lonely', '交流0', (r) => r.checked_in_at && !r.absent_at && r.encounter_people === 0],
  ];
  const matches = (r) => {
    const q = list.q.trim().toLowerCase();
    if (!q) return true;
    if (/^\d+$/.test(q)) return String(r.entry_no) === q; // 数字だけなら受付番号で引く（受付で「12番です」と言われた時）
    return r.nickname.toLowerCase().includes(q) || (r.affiliation || '').toLowerCase().includes(q) || (r.full_name || '').toLowerCase().includes(q);
  };
  const visibleRows = () => list.rows.filter(FILTERS.find((f) => f[0] === list.filter)[2]).filter(matches);
  const monsterOptions = (selected) => current.dashboard.monsters.map((m) => `<option value="${m.id}" ${m.id === selected ? 'selected' : ''}>${esc(m.emoji)} ${esc(m.name)}${m.rarity !== 'normal' ? `【${RARITY[m.rarity]}】` : ''}${m.is_active ? '' : '（無効）'}</option>`).join('');
  const roleOptions = (selected) => Object.entries(ROLE).map(([v, l]) => `<option value="${v}" ${v === selected ? 'selected' : ''}>${l}</option>`).join('');
  const entryTag = (r) => (r.absent_at ? '<span class="tag absent">欠席</span>' : r.checked_in_at ? `<span class="tag in">${time(r.checked_in_at)}</span>` : '<span class="tag wait">未入場</span>');
  async function reloadParticipants() { list.rows = await admin('mb_admin_participants', { p_event_id: current.eventId }); }

  async function tabParticipants(box) {
    box.innerHTML = '<p class="muted">読み込み中…</p>';
    await reloadParticipants();
    box.innerHTML = `
      <div class="grid">
        <form class="panel row" id="addParticipant">
          <b style="width:100%">1人ずつ追加（スタッフ・主催者・スポンサー・名簿にない当日参加者など）</b>
          <input type="text" id="pNick" placeholder="ニックネーム" class="grow" maxlength="20" required>
          <input type="text" id="pAff" placeholder="所属（任意）" style="width:160px" maxlength="40">
          <select id="pRole">${roleOptions('staff')}</select>
          <select id="pMonster"><option value="">モンスター：自動（均等配布）</option>${monsterOptions(null)}</select>
          <button class="btn">＋ 追加</button>
        </form>
        <details class="panel" id="importBox">
          <summary>📋 名簿を貼り付けて一括登録・一括更新</summary>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
            <p class="faint">表計算ソフトからそのまま貼り付けできます（タブ区切り・カンマ区切り）。1行に1人。<br>
              <b>ニックネーム, 所属, 役割</b> … 新しく登録（まだ来ていない扱い）<br>
              <b>No, ニックネーム, 所属, 役割</b> … 先頭が数字なら、その受付番号の人を更新（名前の聞き間違い・所属の差し替え）<br>
              役割は 参加者／スタッフ／主催者／スポンサー／ゲスト（空欄なら参加者、更新時は変更なし）。1行目が見出しなら自動で飛ばします。</p>
            <textarea id="importText" rows="6" placeholder="山田太郎\tA社\n鈴木花子\tB社\tスタッフ\n12\t佐藤\tC社"></textarea>
            <div class="row"><button type="button" class="btn-ghost" id="importPreview">確認する</button><span class="faint grow" id="importSummary"></span><button type="button" class="btn" id="importRun" disabled>取り込む</button></div>
          </div>
        </details>
        <div class="panel" style="display:flex;flex-direction:column;gap:10px">
          <div class="row"><input type="search" id="search" placeholder="No・ニックネーム・所属で検索" class="grow" value="${esc(list.q)}" autocomplete="off"></div>
          <div class="row"><div class="chips grow" id="filters"></div><button type="button" class="btn-ghost" id="printCards">🖨 受付カードを印刷</button></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th class="num">No</th><th>ニックネーム</th><th>役割</th><th>担当</th><th>入場</th><th class="num">交流</th><th class="num">発見</th><th class="num">LINE</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table></div>
        <div id="more" style="text-align:center"></div>
      </div>`;
    renderRows();

    const search = document.getElementById('search');
    let searchTimer;
    search.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { list.q = search.value; list.limit = PAGE; renderRows(); }, 150); };

    document.getElementById('addParticipant').onsubmit = async (e) => {
      e.preventDefault();
      const nickname = document.getElementById('pNick').value;
      const created = await run(() => admin('mb_admin_add_participant', { p_event_id: current.eventId, p_nickname: nickname, p_role: document.getElementById('pRole').value, p_monster_id: document.getElementById('pMonster').value || null, p_affiliation: document.getElementById('pAff').value || null }), '参加者を追加しました');
      if (!created) return;
      document.getElementById('pNick').value = ''; document.getElementById('pAff').value = '';
      await loadDashboard(); await reloadParticipants(); renderRows();
      const cards = await run(() => admin('mb_admin_issue_logins', { p_event_id: current.eventId, p_participant_ids: [created.participantId] }));
      if (cards) showCards(cards);
    };

    let parsed = [];
    const ROLE_BY_LABEL = Object.fromEntries(Object.entries(ROLE).flatMap(([v, l]) => [[l, v], [v, v]]));
    document.getElementById('importPreview').onclick = () => {
      parsed = []; const problems = [];
      document.getElementById('importText').value.split(/\r?\n/).forEach((line, i) => {
        if (!line.trim()) return;
        const cols = line.split(line.includes('\t') ? '\t' : ',').map((c) => c.trim());
        if (i === 0 && /^(no|番号|ニックネーム|名前|氏名)$/i.test(cols[0])) return; // 見出し行
        const hasNo = /^\d+$/.test(cols[0]);
        const [no, nickname, affiliation, roleLabel] = hasNo ? cols : [null, ...cols];
        const role = roleLabel ? ROLE_BY_LABEL[roleLabel] : null;
        if (roleLabel && !role) { problems.push(`${i + 1}行目：役割「${roleLabel}」が読めません`); return; }
        const row = { nickname: nickname || '' };
        if (hasNo) row.no = Number(no);
        if (affiliation !== undefined) row.affiliation = affiliation;
        if (role) row.role = role;
        parsed.push(row);
      });
      const adds = parsed.filter((r) => r.no == null).length;
      document.getElementById('importSummary').textContent = `新規 ${adds}人 ・ 更新 ${parsed.length - adds}人${problems.length ? ` ／ ⚠️ ${problems.join('、')}` : ''}`;
      document.getElementById('importRun').disabled = !parsed.length;
    };
    document.getElementById('importRun').onclick = async () => {
      const result = await run(() => admin('mb_admin_import', { p_event_id: current.eventId, p_rows: parsed }));
      if (!result) return;
      toast(`新規 ${result.added}人 ・ 更新 ${result.updated}人${result.errors.length ? ` ・ 取り込めなかった行 ${result.errors.length}` : ''}`);
      document.getElementById('importSummary').textContent = result.errors.map((x) => `${x.line}行目：${x.message}`).join(' ／ ');
      if (!result.errors.length) { document.getElementById('importText').value = ''; document.getElementById('importRun').disabled = true; }
      await loadDashboard(); await reloadParticipants(); renderRows();
    };

    document.getElementById('printCards').onclick = async () => {
      const targets = visibleRows().filter((r) => !r.absent_at);
      if (!targets.length) return toast('印刷する人がいません（絞り込みを確認してください）');
      const alreadyIn = targets.filter((r) => r.checked_in_at).length;
      const message = `表示中の ${targets.length}人分の受付カードを発行して印刷します。` +
        (alreadyIn ? `\n\n⚠️ うち ${alreadyIn}人はすでに入場済みです。発行し直すと、その人のスマホはログアウトされ、新しいカードで入り直しになります。\n（未入場の人だけにするなら「未入場」で絞り込んでください）` : '\n\n以前に印刷したこの人たちのカードは使えなくなります。');
      if (!confirm(message)) return;
      const cards = await run(() => admin('mb_admin_issue_logins', { p_event_id: current.eventId, p_participant_ids: targets.map((r) => r.id) }));
      if (cards) showCards(cards);
    };
  }

  function renderRows() {
    const filters = document.getElementById('filters');
    if (!filters) return;
    filters.innerHTML = FILTERS.map(([k, l, fn]) => `<button type="button" data-filter="${k}" aria-pressed="${list.filter === k}">${l} ${list.rows.filter(fn).length}</button>`).join('');
    filters.querySelectorAll('[data-filter]').forEach((b) => (b.onclick = () => { list.filter = b.dataset.filter; list.limit = PAGE; renderRows(); }));
    const rows = visibleRows();
    const monsterById = Object.fromEntries(current.dashboard.monsters.map((m) => [m.id, m]));
    document.getElementById('rows').innerHTML = rows.slice(0, list.limit).map((r) => {
      const m = monsterById[r.monster_id];
      return `<tr class="${r.absent_at ? 'absent' : ''}">
        <td class="num faint">${r.entry_no}</td>
        <td><b>${esc(r.nickname)}</b>${r.via_line ? ' <span class="tag line">LINE</span>' : ''}${r.affiliation ? `<br><span class="faint">${esc(r.affiliation)}</span>` : ''}</td>
        <td class="faint">${ROLE[r.role]}</td>
        <td title="${esc(m ? m.name : '')}">${m ? esc(m.emoji) : '―'}${m && m.rarity !== 'normal' ? `<small style="color:var(--witch)"> ${RARITY[m.rarity]}</small>` : ''}</td>
        <td>${entryTag(r)}</td>
        <td class="num">${r.encounter_people}</td><td class="num">${r.species_found}</td><td class="num">${r.bingo_lines}</td>
        <td style="text-align:right"><button class="link" data-edit="${r.id}">編集</button></td>
      </tr>`;
    }).join('') || `<tr><td colspan="9" class="faint" style="text-align:center;padding:20px">該当する人はいません</td></tr>`;
    document.getElementById('rows').querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => editParticipant(b.dataset.edit)));
    const rest = rows.length - list.limit;
    const more = document.getElementById('more');
    more.innerHTML = rest > 0 ? `<button class="btn-ghost" id="moreBtn">さらに表示（残り ${rest}人）</button>` : `<p class="faint">${rows.length}人を表示中</p>`;
    const moreBtn = document.getElementById('moreBtn');
    if (moreBtn) moreBtn.onclick = () => { list.limit += PAGE; renderRows(); };
  }

  function editParticipant(id) {
    const r = list.rows.find((x) => x.id === id);
    if (!r) return;
    const el = modal(`
      <div class="row"><h2 class="display grow" style="font-size:18px">No.${r.entry_no} ${esc(r.nickname)}</h2>${entryTag(r)}</div>
      <form id="editForm" style="display:flex;flex-direction:column;gap:10px">
        <label class="field">ニックネーム（画面に出る名前）<input type="text" name="nickname" value="${esc(r.nickname)}" maxlength="20" required></label>
        <label class="field">お名前（任意）<input type="text" name="full_name" value="${esc(r.full_name || '')}" maxlength="40"></label>
        <label class="field">所属（任意）<input type="text" name="affiliation" value="${esc(r.affiliation || '')}" maxlength="40"></label>
        <label class="field">役割<select name="role">${roleOptions(r.role)}</select></label>
        <label class="field">担当モンスター<select name="monster_id">${monsterOptions(r.monster_id)}</select></label>
        <button class="btn">保存</button>
      </form>
      <p class="faint">交流 ${r.encounter_people}人 ・ 発見 ${r.species_found}種 ・ ${r.bingo_lines} LINE</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn-ghost" data-act="card">🎫 受付カードを${r.checked_in_at ? '再発行（今のスマホはログアウト）' : '発行'}</button>
        <button class="btn-ghost" data-act="absent">${r.absent_at ? '↩ 欠席を取り消す（参加に戻す）' : '🚫 欠席にする（人数・交換から外す。あとで戻せます）'}</button>
        ${r.checked_in_at && !r.absent_at ? '<button class="btn-ghost" data-act="uncheck">↩ 入場を取り消す（受付のやり直し）</button>' : ''}
        <button class="btn-ghost" data-act="rotate" style="color:var(--witch)">交換用QRを作り直す（スクショ共有の疑いがある時）</button>
        <button class="btn-danger" data-act="remove">この人を削除（元に戻せません。通常は「欠席」を使ってください）</button>
        <button class="link" data-act="close" style="align-self:center">閉じる</button>
      </div>`);
    const after = async () => { await loadDashboard(); await reloadParticipants(); renderRows(); };
    el.querySelector('#editForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const ok = await run(() => admin('mb_admin_update_participant', { p_event_id: current.eventId, p_participant_id: id, p_patch: {
        nickname: field(f, 'nickname').value, full_name: field(f, 'full_name').value, affiliation: field(f, 'affiliation').value,
        role: field(f, 'role').value, monster_id: field(f, 'monster_id').value } }), '保存しました');
      if (ok) { el.remove(); await after(); }
    };
    el.querySelectorAll('[data-act]').forEach((b) => (b.onclick = async () => {
      const act = b.dataset.act;
      if (act === 'close') return el.remove();
      if (act === 'card') {
        if (r.checked_in_at && !confirm('この人のスマホはログアウトされ、新しいカードで入り直しになります。発行しますか？')) return;
        const cards = await run(() => admin('mb_admin_issue_logins', { p_event_id: current.eventId, p_participant_ids: [id] }));
        if (cards) { el.remove(); showCards(cards); await after(); }
        return;
      }
      if (act === 'absent') {
        await run(() => admin('mb_admin_update_participant', { p_event_id: current.eventId, p_participant_id: id, p_patch: { absent: !r.absent_at } }), r.absent_at ? '参加に戻しました' : '欠席にしました');
      } else if (act === 'uncheck') {
        await run(() => admin('mb_admin_update_participant', { p_event_id: current.eventId, p_participant_id: id, p_patch: { checked_in: false } }), '入場を取り消しました');
      } else if (act === 'rotate') {
        if (!confirm('交換用のQRを作り直しますか？（古いQR・スクショは使えなくなります）')) return;
        await run(() => admin('mb_admin_rotate_qr', { p_event_id: current.eventId, p_participant_id: id }), 'QRを作り直しました');
      } else if (act === 'remove') {
        if (!confirm(`No.${r.entry_no} ${r.nickname} さんを削除しますか？（元に戻せません）`)) return;
        await run(() => admin('mb_admin_remove_participant', { p_event_id: current.eventId, p_participant_id: id }), '削除しました');
      }
      el.remove(); await after();
    }));
  }

  // ---- 受付カード（91×55mm・A4に10枚）
  //   QR＝読むだけで本人としてログインできるURL。読めない時のために 受付番号＋4桁PIN も載せる。
  //   PIN とログイン情報はこの画面にしか出ない。閉じると二度と表示できない（必要なら再発行）
  function cardHtml(card, x, y) {
    const url = `${participantAppUrl()}?s=${encodeURIComponent(card.sessionToken)}`;
    return `<div class="card91" style="left:${x}mm;top:${y}mm">
      <div class="qrp">${qrSvg(url, 'M')}</div>
      <div class="info">
        <p class="brand">🎃 MONSTER BINGO</p>
        <p class="ev">${esc(ev().name)}</p>
        <p class="nick">${esc(card.nickname)}</p>
        <p class="aff">${esc(card.affiliation || '')}</p>
        <div class="creds"><div><small>受付番号</small><b>${card.entryNo}</b></div><div><small>PIN</small><b>${card.pin}</b></div></div>
        <p class="how">① スマホのカメラでQRを読む<br>② 読めない時は ${esc(participantAppUrl().replace(/^https?:\/\//, ''))} を開き「番号で入る」→ コード <b>${esc(ev().code)}</b>・番号・PIN</p>
      </div>
    </div>`;
  }
  function sheetPages(cards) {
    const pages = [];
    for (let i = 0; i < cards.length; i += 10) {
      const slice = cards.slice(i, i + 10);
      pages.push(`<div class="sheet-page">${slice.map((c, k) => cardHtml(c, 14 + (k % 2) * 91, 11 + Math.floor(k / 2) * 55)).join('')}</div>`);
    }
    return pages.join('');
  }
  function showCards(cards) {
    if (!cards.length) return toast('発行できる人がいませんでした');
    const pages = sheetPages(cards);
    document.getElementById('printSheet').innerHTML = pages;
    const view = document.createElement('div');
    view.className = 'print-preview';
    view.innerHTML = `
      <div class="bar">
        <b class="grow">受付カード ${cards.length}枚（A4 ${Math.ceil(cards.length / 10)}ページ）</b>
        <button class="btn" id="doPrint">🖨 印刷する</button>
        <button class="btn-ghost" id="closePrint">閉じる</button>
        <p class="faint" style="width:100%">印刷設定：用紙 A4・倍率 100%（「用紙に合わせる」はオフ）・余白なし。印刷したら1枚、スマホで読めるか試してから配ってください。<br>
          この画面を閉じるとPINは二度と表示できません（必要ならその人だけ再発行）。</p>
      </div>
      <div id="pagesPreview">${pages}</div>`;
    document.body.appendChild(view);
    // 画面幅に合わせて縮小表示（印刷は #printSheet 側を原寸で出すので、ここの縮小は紙に影響しない）
    const fit = () => { const scale = Math.min(1, (window.innerWidth - 32) / (210 * 96 / 25.4)); view.querySelectorAll('#pagesPreview .sheet-page').forEach((p) => { p.style.zoom = scale; }); };
    fit(); window.addEventListener('resize', fit);
    view.querySelector('#doPrint').onclick = () => window.print();
    view.querySelector('#closePrint').onclick = () => {
      if (!confirm('閉じるとPINは二度と表示できません。印刷は済みましたか？')) return;
      window.removeEventListener('resize', fit);
      view.remove(); document.getElementById('printSheet').innerHTML = '';
    };
  }

  // ---- 交換履歴・不正ログ
  async function tabEncounters(box) {
    const rows = await admin('mb_admin_encounters', { p_event_id: current.eventId });
    box.innerHTML = `<p class="faint" style="margin-bottom:8px">最新300件（5秒ごとに更新）</p><div class="table-wrap"><table>
      <thead><tr><th>時刻</th><th>読み込んだ人</th><th>獲得</th><th>読まれた人</th><th>獲得</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td class="faint">${new Date(r.created_at).toLocaleTimeString('ja-JP')}</td><td><b>${esc(r.scanner_nickname)}</b></td><td>${esc(r.scanner_received_monster || '―')}</td><td><b>${esc(r.target_nickname)}</b></td><td>${esc(r.target_received_monster || '―')}</td></tr>`).join('')}</tbody>
    </table></div>${rows.length ? '' : '<p class="faint" style="text-align:center;padding:20px">まだ交換はありません</p>'}`;
  }
  async function tabFraud(box) {
    const rows = await admin('mb_admin_fraud_logs', { p_event_id: current.eventId });
    box.innerHTML = `<p class="faint" style="margin-bottom:8px">「QRスクショ共有の疑い」が出た人は、参加者タブで QR再発行 すると古い画像が無効になります。</p>
      <div style="display:flex;flex-direction:column;gap:6px">${rows.map((r) => `<div class="panel row" style="padding:10px 14px"><span class="faint">${new Date(r.created_at).toLocaleTimeString('ja-JP')}</span>
        <span class="status" style="background:rgba(229,72,77,.2);color:var(--bad)">${esc(r.kind)}</span><b>${esc(r.nickname || '―')}</b><span class="muted grow">${esc(FRAUD[r.kind] || r.kind)}</span><span class="faint" style="font-family:monospace">${esc(JSON.stringify(r.detail))}</span></div>`).join('') || '<p class="faint" style="text-align:center;padding:20px">不正の疑いはありません</p>'}</div>`;
  }

  // ---------------------------------------------------------------- 起動
  if (!CONFIG.supabaseUrl || CONFIG.supabaseUrl.includes('YOUR-PROJECT')) {
    app.innerHTML = '<div class="panel"><p class="display" style="font-size:18px">接続設定がまだです</p><p class="muted" style="margin-top:8px">config.js に Supabase の URL と anon キーを入れてください。</p></div>';
    return;
  }
  if (store.get(TOKEN_KEY)) renderEventList().catch(() => {}); else renderLogin();
})();
</script>
</body>
