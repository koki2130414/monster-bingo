<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="description" content="話しかけるほど、モンスターが集まる。ハロウィン交流ビンゴ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MONSTER BINGO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<style>
/* スマホ1画面のゲームアプリ：上にヘッダー、中央に各タブ、下に SCAN を大きく置いたナビ */
:root {
  --night: #0b0a10; --night-2: #12101a; --night-3: #1b1826; --night-4: #262236;
  --line: rgba(255,255,255,.1); --text: #f6f3ff; --muted: rgba(246,243,255,.62); --faint: rgba(246,243,255,.4);
  --pumpkin: #ff7a1a; --pumpkin-soft: #ffb870; --pumpkin-deep: #8a3800;
  --witch: #ae7bff; --witch-deep: #6d2ee6; --gold: #f5c542; --danger: #ffb0b0;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100dvh; color: var(--text); font-family: var(--font-body); font-size: 15px;
  background: radial-gradient(40rem 30rem at 110% -10%, rgba(139,77,255,.28), transparent 60%),
              radial-gradient(36rem 28rem at -20% 110%, rgba(255,122,26,.18), transparent 60%), var(--night);
  background-attachment: fixed; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--pumpkin-soft); outline-offset: 2px; }
a { color: var(--pumpkin-soft); }
h1, h2, p { margin: 0; text-wrap: balance; }
.display { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; }
.app { max-width: 460px; margin: 0 auto; }
.screen { padding: 16px 16px 128px; display: flex; flex-direction: column; gap: 14px; }
.center { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 20px; gap: 14px; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .28em; color: var(--witch); }
.muted { color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1.7; }
.faint { color: var(--faint); font-size: 11px; font-weight: 700; line-height: 1.6; }
.title-grad { background: linear-gradient(180deg,#fff 10%,var(--pumpkin-soft) 55%,var(--pumpkin) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 rgba(60,20,0,.9)) drop-shadow(0 0 16px rgba(255,122,26,.45)); }
.glow-o { text-shadow: 0 0 18px rgba(255,122,26,.65), 0 2px 0 rgba(0,0,0,.6); }
.glow-p { text-shadow: 0 0 18px rgba(174,123,255,.7), 0 2px 0 rgba(0,0,0,.6); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 18px; padding: 16px 22px;
  font-family: var(--font-display); font-size: 18px; color: var(--night); background: linear-gradient(180deg,var(--pumpkin-soft),var(--pumpkin) 55%,#e65f00);
  box-shadow: 0 4px 0 var(--pumpkin-deep), 0 10px 30px -8px rgba(255,122,26,.7); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--pumpkin-deep); }
.btn:disabled { opacity: .45; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 1px solid rgba(255,255,255,.16);
  background: rgba(255,255,255,.05); border-radius: 16px; padding: 12px 16px; font-weight: 800; text-decoration: none; color: var(--text); }
.panel { background: linear-gradient(160deg,rgba(52,48,74,.85),rgba(18,16,26,.92)); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 18px 40px -18px rgba(0,0,0,.8); }
input[type=text] { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,.16); background: rgba(11,10,16,.6); color: var(--text); padding: 15px 16px; font: 800 18px var(--font-body); }
input[type=text]:focus { border-color: var(--pumpkin-soft); outline: none; }
.error { border-radius: 14px; background: rgba(255,80,80,.14); color: var(--danger); padding: 12px 14px; font-weight: 800; font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; }
.row > .grow { flex: 1; min-width: 0; }

.face { flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: var(--s); height: var(--s); font-size: calc(var(--s) * .56); line-height: 1; overflow: hidden;
  background: radial-gradient(circle at 35% 30%, var(--c), color-mix(in srgb, var(--c) 40%, transparent) 55%, var(--night-2) 100%);
  box-shadow: 0 0 calc(var(--s) / 4) color-mix(in srgb, var(--c) 40%, transparent), inset 0 2px 0 rgba(255,255,255,.25); }
.face img { width: 82%; height: 82%; object-fit: cover; border-radius: 50%; }
.face.silhouette { background: radial-gradient(circle at 35% 30%, var(--night-4), var(--night-2)); box-shadow: inset 0 0 0 1px var(--line); }
.face.silhouette > * { filter: brightness(0) opacity(.55); }
.badge { font-family: var(--font-display); font-size: 9px; letter-spacing: .1em; border-radius: 999px; padding: 2px 8px; }
.badge.rare { background: linear-gradient(90deg,var(--gold),var(--pumpkin)); color: var(--night); }
.badge.secret { background: linear-gradient(90deg,var(--witch),#d946ef); color: #fff; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(11,10,16,.86); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.05); }
.topbar .inner { max-width: 460px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; }
.banner { text-align: center; font-size: 12px; font-weight: 800; padding: 5px 12px; background: var(--witch-deep); }
.banner.ended { background: var(--night-4); }
.banner.paused { background: #6b5200; color: #ffe9a8; }
.banner.offline { background: #4a1f1f; color: #ffd0d0; }
.notice { display: flex; gap: 10px; align-items: flex-start; margin: 8px 16px 0; padding: 10px 12px; border-radius: 14px; background: linear-gradient(135deg, rgba(255,122,26,.25), rgba(174,123,255,.2)); border: 1px solid rgba(255,184,112,.45); font-weight: 800; font-size: 13px; line-height: 1.5; animation: pop .4s both; }
.notice button { background: none; border: 0; color: inherit; font-size: 16px; line-height: 1; padding: 2px 4px; opacity: .7; }
.guide-img { width: 100%; border-radius: 14px; display: block; }
.pill { border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,.1); white-space: nowrap; }
.pill.orange { background: rgba(255,122,26,.2); color: var(--pumpkin-soft); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 4px 4px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(11,10,16,.93); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.nav ul { list-style: none; margin: 0 auto; padding: 0; max-width: 460px; display: grid; grid-template-columns: repeat(5,1fr); align-items: end; }
.nav button { width: 100%; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; font-size: 9px; font-weight: 800; color: var(--faint); }
.nav button .ic { font-size: 20px; line-height: 1; filter: grayscale(.4); }
.nav button[aria-current=page] { color: var(--pumpkin-soft); }
.nav button[aria-current=page] .ic { filter: none; }
.nav .scan-btn { margin: -30px auto 0; width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--night); gap: 0; justify-content: center;
  background: radial-gradient(circle at 35% 30%,#ffd3a3,var(--pumpkin) 55%,#c24e00); box-shadow: 0 6px 0 #6b2c00, 0 12px 30px -6px rgba(255,122,26,.8);
  color: var(--night); font-family: var(--font-display); font-size: 11px; }
.nav .scan-btn svg { width: 28px; height: 28px; }

.board { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 6px; padding: 8px; border-radius: 24px; border: 1px solid var(--line);
  background: linear-gradient(180deg,var(--night-4),var(--night-2)); box-shadow: 0 24px 50px -20px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.1); }
.cell { aspect-ratio: 1; perspective: 600px; }
.cell-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.4,.5,1); }
.cell.open .cell-inner { transform: rotateY(180deg); }
.cell-face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.cell-face.front { background: var(--night-3); border: 1px solid rgba(255,255,255,.05); box-shadow: inset 0 -3px 0 rgba(0,0,0,.4); }
.cell-face.back { transform: rotateY(180deg); background: linear-gradient(145deg,var(--c),var(--night-2) 130%); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.35); }
.cell-emoji { font-size: clamp(18px,6.2vw,27px); line-height: 1.05; }
.cell-emoji img { width: 1.2em; height: 1.2em; border-radius: 50%; object-fit: cover; }
.cell-face.front .cell-emoji { filter: grayscale(1) opacity(.4); }
.cell-name { font-size: 8.5px; font-weight: 800; width: 100%; text-align: center; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-face.front .cell-name { color: var(--faint); }
.get-tag { position: absolute; top: 3px; right: 3px; background: #fff; color: var(--night); border-radius: 999px; font-size: 6.5px; font-weight: 900; padding: 0 4px; }
.free-face { position: absolute; inset: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg,var(--pumpkin-soft),var(--pumpkin) 60%,#c24e00); color: var(--night); }
.free-face b { font-family: var(--font-display); font-weight: 400; font-size: 9px; }
.cell.in-line .cell-face.back, .cell.in-line .free-face { box-shadow: 0 0 0 2px var(--pumpkin-soft), 0 0 18px rgba(255,122,26,.6); }
.cell.fresh { animation: glow 1.4s ease-out .5s 2; }
@keyframes glow { 40% { filter: drop-shadow(0 0 14px rgba(255,184,112,1)); } }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; }
.stat .v { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; color: var(--faint); margin-left: 4px; }
.bar { height: 12px; border-radius: 999px; background: rgba(11,10,16,.7); overflow: hidden; }
.bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg,var(--witch-deep),var(--pumpkin),var(--pumpkin-soft)); transition: width .7s; }
.dex { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
.dex-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; text-align: center; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg,var(--night-4),var(--night-2)); }
.dex-item.unknown { border-style: dashed; background: rgba(18,16,26,.6); }
.dex-item.secret { border-color: rgba(174,123,255,.45); background: rgba(109,46,230,.12); }
.dex-item .nm { font-size: 11px; font-weight: 800; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dex-item .st { font-size: 10px; font-weight: 900; color: var(--pumpkin-soft); }
.dex-item.unknown .nm, .dex-item.unknown .st { color: var(--faint); }
.dex-item .badge { position: absolute; top: -8px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--night-3); border-radius: 16px; padding: 4px; }
.tabs button { border: 0; background: none; border-radius: 12px; padding: 11px 4px; font-weight: 800; font-size: 13px; color: var(--muted); }
.tabs button[aria-selected=true] { background: var(--pumpkin); color: var(--night); }
.camera { position: relative; aspect-ratio: 1; width: 100%; border-radius: 24px; overflow: hidden; border: 2px solid rgba(255,122,26,.6); background: #000; box-shadow: 0 0 40px -10px rgba(255,122,26,.7); }
.camera video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camera .frame { position: absolute; inset: 14%; border: 4px dashed rgba(255,255,255,.7); border-radius: 18px; pointer-events: none; }
.camera .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; font-weight: 800; font-size: 13px; background: rgba(11,10,16,.75); }
.qr-box { background: #fff; padding: 12px; border-radius: 22px; width: 250px; max-width: 100%; box-shadow: 0 0 0 6px rgba(255,122,26,.9), 0 0 50px rgba(255,122,26,.5); }
.qr-box svg, .qr-box img { display: block; width: 100%; height: auto; }

.rank { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.rank li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); }
.rank li.me { background: rgba(255,122,26,.18); box-shadow: inset 0 0 0 1px var(--pumpkin-soft); }
.rank .pos { width: 42px; text-align: center; font-family: var(--font-display); font-size: 17px; }
.rank .nm { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank .val { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.rank .val small { font-size: 10px; color: var(--faint); margin-left: 3px; }

.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.step { position: relative; padding: 12px; text-align: left; }
.step .n { position: absolute; right: 12px; top: 6px; font-family: var(--font-display); font-size: 24px; color: rgba(255,255,255,.1); }
.step .t { font-family: var(--font-display); font-size: 15px; color: var(--pumpkin-soft); margin-top: 4px; }

.overlay { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; overflow: hidden; background: rgba(11,10,16,.93); backdrop-filter: blur(4px); }
.overlay > *:not(.rays):not(.confetti) { position: relative; }
.rays { position: absolute; width: 160vmax; height: 160vmax; background: repeating-conic-gradient(from 0deg, rgba(255,184,112,.22) 0deg 10deg, transparent 10deg 24deg); animation: spin 14s linear infinite;
  -webkit-mask-image: radial-gradient(circle,#000 20%,transparent 65%); mask-image: radial-gradient(circle,#000 20%,transparent 65%); }
.rays.gold { background: repeating-conic-gradient(from 0deg, rgba(245,197,66,.35) 0deg 8deg, transparent 8deg 20deg); }
.rays.purple { background: repeating-conic-gradient(from 0deg, rgba(174,123,255,.3) 0deg 10deg, transparent 10deg 24deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.pop { animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: none; } }
.float { animation: float 3s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; top: 0; animation: fall var(--d) linear var(--delay) forwards; }
@keyframes fall { from { transform: translate3d(0,-10vh,0) rotate(0); } to { transform: translate3d(var(--x),110vh,0) rotate(720deg); } }
.summon-circle { width: 260px; height: 260px; max-width: 100%; animation: summon 2.2s cubic-bezier(.5,0,.3,1) both; }
@keyframes summon { 0% { transform: scale(.3) rotate(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.05) rotate(540deg); } }
.shake { animation: shake .3s ease-in-out 2; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.spinner { font-size: 44px; animation: float 1.4s ease-in-out infinite; }
.terms { text-align: left; max-width: 420px; line-height: 1.8; font-size: 13px; overflow-y: auto; max-height: 80dvh; }
.terms h2 { font-family: var(--font-display); font-weight: 400; font-size: 16px; margin-top: 18px; color: var(--pumpkin-soft); }
.terms ul { padding-left: 1.2em; margin: 6px 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app" id="app"><div class="center"><div class="spinner">👻</div><p class="muted">読み込み中…</p></div></div>

<script>
(function () {
  'use strict';

  // ================================================================ 接続
  const CONFIG = window.MONSTER_BINGO_CONFIG || {};
  const SESSION_KEY = 'mb_session';
  const QUEUE_KEY = 'mb_scan_queue';
  const NOTICE_KEY = 'mb_notice_closed';
  // 状態の取りに行く間隔。変化が無ければ少しずつ広げ（最大20秒）、変化があればすぐ戻す。
  //   「自分のQRを見せる」画面の間だけは3秒：まさに今読まれていて、相手と一緒に GET 演出を見たい瞬間だから。
  //   120台が同じWi-Fiにいる会場では、1台あたりの問い合わせ回数がそのまま混雑になる。
  const POLL = { show: 3000, base: 5000, max: 20000 };

  async function rpc(fn, args) {
    let response;
    try {
      response = await fetch(`${CONFIG.supabaseUrl.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json', apikey: CONFIG.supabaseAnonKey },
        // 旧形式の anon キー（JWT）の時だけ Authorization も付ける。新形式の Publishable key は apikey だけで通る
        /^eyJ/.test(CONFIG.supabaseAnonKey) ? { Authorization: `Bearer ${CONFIG.supabaseAnonKey}` } : {}),
      body: JSON.stringify(args || {}),
      });
    } catch (networkError) {
      // 電波が無い・Wi-Fiが詰まっている。サーバーの「ダメ」とは分けて扱う（あとで送り直せる）
      const error = new Error('電波が届いていないようです');
      error.offline = true;
      throw error;
    }
    const body = await response.json().catch(() => null);
    if (!response.ok) {
      const error = new Error((body && body.message) || '通信に失敗しました');
      error.hint = body && body.hint;
      error.offline = response.status >= 500 || response.status === 0;
      throw error;
    }
    return body;
  }
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
    remove(key) { try { localStorage.removeItem(key); } catch (e) {} },
  };

  // ================================================================ 共通
  const app = document.getElementById('app');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeColor = (c) => (/^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#34304a');
  const safeUrl = (u) => (/^https:\/\//.test(u || '') ? u : null);
  function monsterGlyph(m) {
    if (!m) return '<span>❔</span>';
    const url = safeUrl(m.imageUrl);
    return url ? `<img src="${esc(url)}" alt="${esc(m.name)}">` : `<span>${esc(m.emoji)}</span>`;
  }
  const face = (m, size, silhouette) =>
    `<div class="face ${silhouette ? 'silhouette' : ''}" style="--c:${safeColor(m && m.color)};--s:${size}px">${monsterGlyph(m)}</div>`;
  const badge = (m) => (m && m.rarity !== 'normal' ? `<span class="badge ${m.rarity}">${m.rarity.toUpperCase()}</span>` : '');
  function confetti(n) {
    const sym = ['🎃', '🦇', '👻', '✦', '●', '★'];
    const col = ['#ff7a1a', '#ffb870', '#ae7bff', '#ffffff', '#f5c542'];
    let h = '<div class="confetti" aria-hidden="true">';
    for (let i = 0; i < n; i++) h += `<span style="left:${Math.random() * 100}%;font-size:${10 + Math.random() * 18}px;color:${col[i % col.length]};--d:${2.4 + Math.random() * 2.2}s;--delay:${Math.random() * 0.8}s;--x:${(Math.random() - 0.5) * 160}px">${sym[i % sym.length]}</span>`;
    return h + '</div>';
  }
  function overlay(html, onClickClose) {
    const el = document.createElement('div');
    el.className = 'overlay';
    el.setAttribute('role', 'dialog');
    el.innerHTML = html;
    if (onClickClose) el.addEventListener('click', (e) => { if (!e.target.closest('button,a')) onClickClose(el); });
    document.body.appendChild(el);
    return el;
  }

  const baseUrl = () => location.origin + location.pathname;

  // ================================================================ 起動・URL
  //   ?e=CODE … イベント参加   ?x=TOKEN … 相手のQR（標準カメラで読んだ時）   ?s=SESSION … 運営が追加した参加者のログイン

    return;
  }

  async function boot() {
    const claim = params.get('s');
    if (claim) { storage.set(SESSION_KEY, claim); history.replaceState(null, '', baseUrl()); }
    const scanned = params.get('x');
    if (scanned) { history.replaceState(null, '', baseUrl()); return exchangeFromLink(scanned); }

    const session = storage.get(SESSION_KEY);
    if (session) {
      try {
        const current = await rpc('mb_state', { p_session: session });
        if (!eventCode || current.event.code.toLowerCase() === eventCode.toLowerCase()) {
          if (eventCode) history.replaceState(null, '', baseUrl() + (location.hash || ''));
          applyState(current);
          if (claim) return renderSummon();
          return startGame();
        }
      } catch (error) {
        if (error.hint === 'NOT_JOINED') storage.remove(SESSION_KEY);
        if (error.hint === 'ABSENT') return renderAbsent();
        if (error.offline) return renderOfflineBoot();
      }
    }
    if (eventCode) return renderEventTop();
    renderCodeEntry();
  }

  // ================================================================ 状態の取得と演出
  // サーバーはモンスターの中身を monsters に1回だけ入れ、マス・図鑑・履歴には id だけを載せて返す（応答を軽くするため）。
  //   画面側のコードを変えずに済むよう、ここで id を中身に戻しておく
  function hydrate(next) {
    const dict = next.monsters || {};
    const get = (id) => (id && dict[id] ? Object.assign({ id }, dict[id]) : null);
    next.card.cells.forEach((c) => { c.monster = get(c.monsterId); c.isFree = Boolean(c.isFree); });
    next.collection.forEach((e) => { e.monster = get(e.monsterId); });
    next.recentAcquisitions = next.recentAcquisitions.filter((a) => (a.monster = get(a.monsterId)));
    return next;
  }
  function applyState(next) {
    hydrate(next);
    const previous = state;
    if (!seenAcquisitions) {
      seenAcquisitions = new Set(next.recentAcquisitions.map((a) => a.id));
    } else if (previous) {
      const newOnes = next.recentAcquisitions.filter((a) => !seenAcquisitions.has(a.id)).reverse();
      newOnes.forEach((a) => seenAcquisitions.add(a.id));
      const wasOpen = new Set(previous.card.cells.filter((c) => c.isOpen).map((c) => c.position));
      const opened = next.card.cells.filter((c) => c.isOpen && !wasOpen.has(c.position));
      newOnes.forEach((a) => celebrationQueue.push({ kind: 'get', acquisition: a, opens: opened.some((c) => c.monster && c.monster.id === a.monster.id) }));
      if (next.stats.cardCompleted && !previous.stats.cardCompleted) celebrationQueue.push({ kind: 'bingo', lines: next.stats.bingoLines, all: true });
      else if (next.stats.bingoLines > previous.stats.bingoLines) celebrationQueue.push({ kind: 'bingo', lines: next.stats.bingoLines, all: false });
      if (opened.length) { freshPositions = new Set(opened.map((c) => c.position)); setTimeout(() => { freshPositions = new Set(); }, 4500); }
    }
    state = next;
  }

  // 前回の version を渡し、変わっていなければ {unchanged:true} だけが返る（本文0に近い）。
  //   変わっていない時は画面も作り直さない（描き直しの負荷と、スクロール位置が飛ぶのを避ける）
  let pollDelay = POLL.base;
  let offline = false;
  async function refresh() {
    try {
      const next = await rpc('mb_state', { p_session: storage.get(SESSION_KEY), p_version: state ? state.version : null });
      setOffline(false);
      if (next.unchanged) {
        pollDelay = Math.min(POLL.max, Math.round(pollDelay * 1.5));
        if (tab === 'ranking' && Date.now() - rankingLoadedAt > 15000) loadRanking();
        return;
      }
      pollDelay = POLL.base;
      applyState(next);
      renderGame();
      playCelebrations();
      flushQueue();
    } catch (error) {
      if (error.hint === 'NOT_JOINED') { storage.remove(SESSION_KEY); stopPolling(); state = null; renderCodeEntry('参加情報が見つかりません。もう一度参加してください'); }
      else if (error.hint === 'ABSENT') renderAbsent();
      else if (error.offline) setOffline(true);
    }
  }
  const stopPolling = () => { clearTimeout(pollTimer); pollTimer = null; polling = false; };
  let polling = false;
  const nextDelay = () => (tab === 'scan' && scanTab === 'show' ? POLL.show : pollDelay);
  function schedule() {
    clearTimeout(pollTimer);
    if (!polling) return;
    pollTimer = setTimeout(async () => {
      if (document.visibilityState === 'visible' && !scannerActive()) await refresh();
      schedule();
    }, nextDelay());
  }
  function startGame() {
    renderGame();
    stopPolling();
    polling = true;
    pollDelay = POLL.base;
    schedule();
    flushQueue();
  }
  // 画面に戻ってきた・タブを切り替えた時はすぐ取り直す（間隔が広がっていても待たせない）
  const refreshNow = async () => { if (!polling) return; pollDelay = POLL.base; await refresh(); schedule(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshNow(); });
  window.addEventListener('online', () => { setOffline(false); refreshNow(); flushQueue(); });

  function setOffline(value) {
    if (offline === value) return;
    offline = value;
    const bar = document.getElementById('offlineBar');
    if (bar) bar.hidden = !offline;
  }

  // ---- 電波が無い間に読んだQRは端末に貯めて、戻ったら順番に送る
  //   送る間隔は少しあける（サーバー側の連続スキャン制限にかからないように）
  const readQueue = () => { try { return JSON.parse(storage.get(QUEUE_KEY) || '[]'); } catch (e) { return []; } };
  const writeQueue = (q) => storage.set(QUEUE_KEY, JSON.stringify(q.slice(-30)));
  function enqueueScan(text) {
    const q = readQueue();
    if (!q.some((x) => x.text === text)) q.push({ text, at: Date.now() });
    writeQueue(q);
  }
  let flushing = false;
  async function flushQueue() {
    if (flushing || !storage.get(SESSION_KEY)) return;
    let q = readQueue();
    if (!q.length) return;
    flushing = true;
    try {
      while (q.length) {
        const item = q[0];
        let result;
        try { result = await rpc('mb_exchange', { p_session: storage.get(SESSION_KEY), p_scanned: item.text }); } catch (error) { if (error.offline) break; result = { ok: false }; }
        if (result.code === 'TOO_FAST') { await new Promise((r) => setTimeout(r, 3500)); continue; }
        q = readQueue().filter((x) => x.text !== item.text);
        writeQueue(q);
        await new Promise((r) => setTimeout(r, 3500));
      }
    } finally { flushing = false; }
    if (polling) { pollDelay = POLL.base; refresh(); }
  }

  function playCelebrations() {
    if (celebrating || !celebrationQueue.length) return;
    celebrating = true;
    const item = celebrationQueue.shift();
    const done = (el) => { el.remove(); celebrating = false; playCelebrations(); };
    if (item.kind === 'get') {
      const m = item.acquisition.monster;
      const title = m.rarity === 'rare' ? 'RARE MONSTER FOUND!!' : m.rarity === 'secret' ? 'SECRET MONSTER DISCOVERED' : 'MONSTER GET!';
      overlay(`
        <div class="rays ${m.rarity === 'rare' ? 'gold' : m.rarity === 'secret' ? 'purple' : ''}"></div>${m.rarity !== 'normal' ? confetti(50) : ''}
        <p class="display pop ${m.rarity === 'normal' ? 'glow-o' : 'glow-p'}" style="font-size:${m.rarity === 'normal' ? 38 : 28}px">${title}</p>
        <div class="pop" style="margin:28px 0;animation-delay:.15s"><div class="float">${face(m, 170)}</div></div>
        <p class="display" style="font-size:22px;line-height:1.4">${item.acquisition.sourceName ? `<span style="color:var(--pumpkin-soft)">${esc(item.acquisition.sourceName)}</span>さんの<br>${esc(m.name)}をGET！` : `${esc(m.name)}を発見！`}</p>
        <p class="muted" style="margin-top:10px">${item.opens ? '🎃 ビンゴのマスがOPEN！' : m.rarity === 'secret' ? '図鑑に秘密のページが追加された…' : '図鑑に登録しました'}</p>
        <p class="faint" style="margin-top:34px">タップして続ける</p>`, done);
    } else {
      const el = overlay(`
        <div class="rays"></div>${confetti(70)}
        <p style="font-size:56px">🎃</p>
        <p class="display title-grad pop" style="font-size:${item.all ? 48 : 68}px;line-height:1">${item.all ? 'ALL COMPLETE' : 'BINGO!!'}</p>
        <p class="display pop" style="font-size:28px;margin-top:14px;animation-delay:.2s">${item.lines} LINE${item.lines > 1 ? 'S' : ''}</p>
        <p class="muted" style="margin-top:12px">${item.all ? '全マス制覇！ あなたは真のモンスターハンター' : 'まだまだ続く！全モンスター収集を目指そう'}</p>
        <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:30px">
          <button class="btn" id="bShare">📸 シェアする</button><button class="btn-ghost" id="bClose">ハントを続ける</button>
        </div>`);
      el.querySelector('#bClose').onclick = () => done(el);
      el.querySelector('#bShare').onclick = () => { shareImage(); };
    }
  }

  // ================================================================ ゲーム画面
  const NAV = [['bingo', '🎃', 'BINGO'], ['collection', '📖', 'COLLECTION'], ['scan', '', 'SCAN'], ['me', '👻', 'MY MONSTER'], ['ranking', '👑', 'RANKING']];
  let rankingCache = null;
  let rankingLoadedAt = 0;

  function renderGame() {
    if (!state) return;

    const s = state.stats;

  }
  // 一番新しいお知らせを、閉じるまで上に出す。新しいものが来たら震わせて気づかせる（顔を上げるきっかけ）
  let lastNoticeId = null;
  function noticeHtml() {
    const latest = (state.announcements || [])[0];
    if (!latest) return '';
    if (lastNoticeId !== null && latest.id > lastNoticeId && navigator.vibrate) navigator.vibrate([80, 60, 80]);
    lastNoticeId = latest.id;
    if (String(latest.id) === storage.get(NOTICE_KEY)) return '';
    return `<div class="notice" role="status"><span>📣</span><span style="flex:1">${esc(latest.message)}</span><button id="closeNotice" data-id="${latest.id}" aria-label="お知らせを閉じる">✕</button></div>`;

  function showGuide() {
    const url = safeUrl(state && state.event.guideImageUrl);

  const LINES = (() => { const l = []; for (let i = 0; i < 5; i++) l.push([0, 1, 2, 3, 4].map((c) => i * 5 + c), [0, 1, 2, 3, 4].map((r) => r * 5 + i)); l.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]); return l; })();

  const VIEWS = {
    bingo(s) {
      const open = state.card.cells.map((c) => c.isOpen);

            <div class="cell-face front"><span class="cell-emoji">${glyph}</span><span class="cell-name">${esc(m && m.name)}</span></div>

        ${s.bingoLines ? '<button class="btn-ghost" data-act="share">📸 結果をシェアする</button>' : ''}
        <div class="panel row" style="padding:14px">
          <span style="font-size:28px">🗣️</span>
          <div class="grow"><p class="display" style="font-size:14px;color:var(--pumpkin-soft)">人と話す → QRを読む → GET!</p><p class="faint">まだOPENしていないモンスターを持つ人を探そう</p></div>
          <button data-tab-go="scan" class="display" style="border:0;border-radius:12px;padding:9px 12px;background:var(--pumpkin);color:var(--night)">SCAN</button>
        </div>
        ${state.recentAcquisitions.length ? `<p class="faint" style="letter-spacing:.2em">RECENT GET</p>
          ${state.recentAcquisitions.slice(0, 5).map((a) => `<div class="row" style="background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px"><span style="font-size:20px">${esc(a.monster.emoji)}</span><span class="grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.sourceName ? esc(a.sourceName) + 'さんの' : ''}${esc(a.monster.name)}</span><span class="faint">${new Date(a.createdAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('')}` : ''}`;
    },

    collection(s) {
      const left = s.speciesTotal - s.speciesFound;
      return `
        <section class="panel" style="padding:18px">
          <p class="eyebrow">MONSTER COLLECTION</p>
          <p class="display" style="font-size:38px;font-variant-numeric:tabular-nums">${s.speciesFound}<span style="font-size:18px;color:var(--faint)"> / ${s.speciesTotal}</span></p>
          <div class="bar" style="margin-top:10px"><div style="width:${s.completionRate}%"></div></div>
          <p class="display" style="margin-top:12px;color:var(--pumpkin-soft);font-size:18px">${left > 0 ? `あと${left}種類！` : '🎉 図鑑コンプリート！'}</p>
        </section>
        <div class="dex">
          ${state.collection.map((e) => `<div class="dex-item ${e.found ? '' : 'unknown'}">${e.found ? badge(e.monster) : ''}${face(e.monster, 54, !e.found)}
            <p class="nm">${e.found ? esc(e.monster.name) : '？？？'}</p><p class="st">${e.found ? (e.timesReceived > 1 ? 'GET ×' + e.timesReceived : 'GET') : '未発見'}</p></div>`).join('')}
          ${Array.from({ length: state.undiscoveredSecretCount }, () => `<div class="dex-item secret"><div class="face" style="--c:#2a0f55;--s:54px"><span class="display" style="font-size:24px;color:var(--witch)">?</span></div><p class="nm" style="color:var(--witch)">SECRET</p><p class="faint">会場のどこかに…</p></div>`).join('')}
        </div>`;
    },

    scan() {
      const my = state.myMonster;
      return `
        <div class="panel row" style="padding:14px;border-color:rgba(255,122,26,.3)"><span style="font-size:28px">🗣️</span><p class="display" style="font-size:15px;line-height:1.5">まずは自己紹介してから<br><span style="color:var(--pumpkin-soft)">モンスターを交換しよう！</span></p></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-scantab="scan" aria-selected="${scanTab === 'scan'}">📷 相手のQRを読む</button>
          <button role="tab" data-scantab="show" aria-selected="${scanTab === 'show'}">🔳 自分のQRを見せる</button>
        </div>
        ${scanTab === 'scan' ? `
          <div class="camera" id="camera"><video id="video" playsinline muted autoplay></video><div class="frame"></div>
            <div class="msg" id="cameraMsg"><p style="font-size:34px">📷</p><p>カメラを起動します</p><button class="btn" id="startCamera" style="max-width:240px;font-size:16px;padding:12px">カメラを起動</button></div></div>
          <p class="error" id="scanError" hidden></p>
          <p class="faint" style="text-align:center" id="scanHint">相手の「自分のQRを見せる」画面を枠の中に映してね</p>
          ${state.event.exchangeMode === 'both' ? `<p class="faint" style="text-align:center;color:var(--witch)">読み込むと、相手にもあなたの${esc(my && my.name)}が届きます</p>` : ''}` : `
          <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px">
            <div class="qr-box" id="myQr" role="img" aria-label="あなたのモンスターQRコード"></div>
            <div class="row" style="background:rgba(255,255,255,.05);border-radius:16px;padding:10px 16px">${face(my, 44)}<div><p class="faint" style="letter-spacing:.2em">YOUR MONSTER</p><p class="display" style="font-size:18px">${esc(my && my.name)}</p></div></div>
            <p class="faint" style="text-align:center">このQRはあなた専用です。<br>SNSやチャットには載せないでね。</p>
          </div>`}`;
    },

    me(s) {
      const my = state.myMonster;
      const tiles = [['発見したモンスター', s.speciesFound, '/ ' + s.speciesTotal], ['BINGO', s.bingoLines, s.bingoLines === 1 ? 'LINE' : 'LINES'], ['交流人数', s.encounterPeople, 'PEOPLE'], ['コンプリート率', s.completionRate, '%']];
      return `
        <section style="position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--line);padding:24px;text-align:center;background:linear-gradient(160deg, color-mix(in srgb, ${safeColor(my && my.color)} 65%, transparent), var(--night-2) 75%)">
          <div class="rays" style="left:50%;top:35%;width:140%;height:140%;margin:-70% 0 0 -70%;opacity:.6"></div>
          <p class="eyebrow" style="position:relative;color:rgba(255,255,255,.75)">あなたのモンスター</p>
          <div class="float" style="position:relative;width:fit-content;margin:16px auto">${face(my, 140)}</div>
          <h1 class="display" style="position:relative;font-size:36px">${esc(my && my.name)}</h1>
          <div style="position:relative;margin-top:6px">${badge(my)}</div>
          <p style="position:relative;margin-top:12px;font-weight:800;font-size:13px;line-height:1.7">このモンスターを探している人がいるかも。<br>いろんな人と話してみよう！</p>
          <p class="faint" style="position:relative;margin-top:8px">${esc(state.me.nickname)} さん${state.me.entryNo ? ` ・ No.${state.me.entryNo}` : ''}</p>
        </section>
        <div class="stats">${tiles.map(([l, v, u]) => `<div class="panel stat"><p class="faint">${l}</p><p class="v">${v}<small>${u}</small></p></div>`).join('')}</div>
        <button class="btn-ghost" data-tab-go="scan">🔳 自分のQRを表示</button>
        <button class="btn" data-act="share">📸 ストーリー用画像を作る</button>
        <p class="faint" style="text-align:center">シェア画像には名前や交換相手は載りません</p>
        ${safeUrl(state.event.guideImageUrl) ? '<button class="btn-ghost" data-act="guide">📄 配布ガイドを見る</button>' : ''}
        ${(state.announcements || []).length ? `<p class="faint" style="letter-spacing:.2em;margin-top:6px">お知らせ</p>${state.announcements.map((a) => `<div class="panel" style="padding:10px 14px;font-size:13px;font-weight:800"><span class="faint">${new Date(a.createdAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</span>　${esc(a.message)}</div>`).join('')}` : ''}`;
    },

    ranking() {
      if (!rankingCache || Date.now() - rankingLoadedAt > 10000) loadRanking();
      if (!rankingCache) return `<div class="center" style="min-height:40vh"><div class="spinner">👑</div></div>`;
      if (!rankingCache.enabled) return `<div class="panel" style="padding:32px;text-align:center;margin-top:30px"><p style="font-size:44px">🦇</p><p class="display" style="font-size:20px">ランキングは非公開です</p><p class="muted">順位より、今夜の出会いを楽しもう！</p></div>`;
      const unit = { species: 'MONSTERS', encounters: 'PEOPLE', bingo: 'BINGO', completion: '%' }[rankingCache.metric];
      const medal = (r) => (r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r + '位');
      return `
        <h1 class="display glow-p" style="text-align:center;font-size:24px;line-height:1.3">MONSTER HUNTER<br><span style="color:var(--pumpkin-soft)">RANKING</span></h1>
        ${rankingCache.myEntry ? `<div class="panel row" style="padding:14px;border-color:rgba(255,122,26,.4)"><p class="muted grow">あなた</p><p class="display" style="font-size:20px">${rankingCache.myEntry.rank}位 <span style="color:var(--pumpkin-soft)">${rankingCache.myEntry.value}</span><small class="faint"> ${unit}</small></p></div>` : ''}
        <ol class="rank">${rankingCache.entries.map((r) => `<li class="${r.isMe ? 'me' : ''}"><span class="pos">${medal(r.rank)}</span><span class="nm">${esc(r.name)}</span><span class="val">${r.value}<small>${unit}</small></span></li>`).join('')}</ol>
        ${rankingCache.entries.length ? '' : '<p class="faint" style="text-align:center">まだ誰もモンスターを見つけていません</p>'}`;
    },
  };

  let rankingLoading = false;
  async function loadRanking() {
    if (rankingLoading) return;
    rankingLoading = true;
    try {
      rankingCache = await rpc('mb_ranking', { p_code: state.event.code, p_session: storage.get(SESSION_KEY) });
      rankingLoadedAt = Date.now();
      if (tab === 'ranking') renderGame();
    } catch (e) {} finally { rankingLoading = false; }
  }

  function bindView() {
    app.querySelectorAll('[data-tab-go]').forEach((b) => (b.onclick = () => { if (b.dataset.tabGo === 'scan' && tab === 'me') scanTab = 'show'; switchTab(b.dataset.tabGo); }));
    app.querySelectorAll('[data-scantab]').forEach((b) => (b.onclick = () => { stopScanner(); scanTab = b.dataset.scantab; renderGame(); schedule(); }));
    app.querySelectorAll('[data-act=share]').forEach((b) => (b.onclick = shareImage));
    app.querySelectorAll('[data-act=guide]').forEach((b) => (b.onclick = showGuide));
    const qrBox = document.getElementById('myQr');
    if (qrBox && window.qrcode) {
      const qr = window.qrcode(0, 'M');
      qr.addData(`${baseUrl()}?x=${state.qrToken}`);
      qr.make();
      qrBox.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    }
    const startButton = document.getElementById('startCamera');
    if (startButton) { startButton.onclick = startScanner; startScanner(); }
  }

  // ================================================================ カメラでQR読み取り
  let camera = null; // { stream, timer, busy }
  const scannerActive = () => Boolean(camera);
  function stopScanner() {
    if (!camera) return;
    clearTimeout(camera.timer);
    camera.stream && camera.stream.getTracks().forEach((t) => t.stop());
    camera = null;
  }
  async function startScanner() {
    const video = document.getElementById('video');
    const message = document.getElementById('cameraMsg');
    if (!video || camera) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      message.innerHTML = '<p style="font-size:34px">📷</p><p>このブラウザではカメラが使えません。</p><p class="faint">スマホ標準のカメラで相手のQRを読んでも交換できます。</p>';
      return;
    }
    camera = { stream: null, timer: null, busy: false, last: null };
    try {
      camera.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (error) {
      camera = null;
      message.innerHTML = `<p style="font-size:34px">📷</p><p>${error.name === 'NotAllowedError' ? 'カメラの使用が許可されていません' : 'カメラを起動できませんでした'}</p>
        <p class="faint">iPhone：設定 → Safari → カメラ →「許可」<br>Android：アドレスバーの🔒 → 権限 → カメラ<br>スマホ標準のカメラで相手のQRを読んでもOK！</p>
        <button class="btn" id="retryCamera" style="max-width:220px;font-size:15px;padding:10px">もう一度試す</button>`;
      document.getElementById('retryCamera').onclick = startScanner;
      return;
    }
    video.srcObject = camera.stream;
    await video.play().catch(() => {});
    message.hidden = true;
    const detector = 'BarcodeDetector' in window ? new window.BarcodeDetector({ formats: ['qr_code'] }) : null;
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d', { willReadFrequently: true });
    const scanFrame = async () => {
      if (!camera) return;
      if (!camera.busy && video.readyState >= 2) {
        try {
          let text = null;
          if (detector) {
            const codes = await detector.detect(video);
            text = codes[0] ? codes[0].rawValue : null;
          } else if (window.jsQR) {
            const scale = Math.min(1, 640 / video.videoWidth);
            canvas.width = Math.floor(video.videoWidth * scale); canvas.height = Math.floor(video.videoHeight * scale);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const image = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'dontInvert' });
            text = code ? code.data : null;
          }
          const now = Date.now();
          if (text && !(camera.last && camera.last.text === text && now - camera.last.at < 4000)) {
            camera.last = { text, at: now };
            if (navigator.vibrate) navigator.vibrate(60);
            await handleScanned(text);
          }
        } catch (e) {}
      }
      if (camera) camera.timer = setTimeout(scanFrame, 180);
    };
    scanFrame();
  }

  async function handleScanned(text) {
    camera.busy = true;
    const errorBox = document.getElementById('scanError');
    const hint = document.getElementById('scanHint');
    if (hint) hint.textContent = '🎃 交換中…';
    let result;
    try {
      result = await rpc('mb_exchange', { p_session: storage.get(SESSION_KEY), p_scanned: text });
    } catch (error) {
      if (error.offline) {
        enqueueScan(text);
        setOffline(true);
        result = { ok: false, message: '📡 電波が届いていません。このQRは覚えておいて、電波が戻ったら自動で送ります' };
      } else {
        result = { ok: false, message: error.message };
      }
    }
    if (result.ok) {
      stopScanner();
      tab = 'bingo';
      history.replaceState(null, '', `${baseUrl()}#bingo`);
      await refresh();
      return;
    }
    if (errorBox) { errorBox.hidden = false; errorBox.textContent = result.message; errorBox.classList.remove('shake'); void errorBox.offsetWidth; errorBox.classList.add('shake'); }
    if (hint) hint.textContent = '相手の「自分のQRを見せる」画面を枠の中に映してね';
    setTimeout(() => { if (camera) camera.busy = false; }, 1800);
  }

  // 標準カメラで相手のQR（…?x=TOKEN）を読んだ時
  async function exchangeFromLink(token) {
    app.innerHTML = `<div class="center"><div class="spinner">🎃</div><p class="display" style="font-size:20px">交換中…</p></div>`;
    const session = storage.get(SESSION_KEY);
    if (!session) {
      app.innerHTML = `<div class="center"><p style="font-size:56px">🎟️</p><p class="display" style="font-size:20px">まずは MONSTER BINGO に参加しよう</p><p class="muted">受付のQRコード、またはイベントコードから参加してから、もう一度読み取ってね。</p><button class="btn" id="toTop" style="max-width:300px">参加する</button></div>`;
      document.getElementById('toTop').onclick = () => renderCodeEntry();
      return;
    }
    let result;
    try { result = await rpc('mb_exchange', { p_session: session, p_scanned: token }); } catch (error) {
      if (error.offline) enqueueScan(token);
      result = { ok: false, message: error.offline ? '📡 電波が届いていません。電波が戻ったら自動で送ります' : error.message };
    }
    try { applyState(await rpc('mb_state', { p_session: session })); } catch (e) {}
    if (!result.ok) {
      app.innerHTML = `<div class="center"><p style="font-size:56px">👻</p><p class="display" style="font-size:20px">${esc(result.message)}</p><button class="btn" id="back" style="max-width:300px">カードに戻る</button></div>`;
      document.getElementById('back').onclick = () => { tab = 'bingo'; state ? startGame() : boot(); };
      return;
    }
    const r = result.received;
    seenAcquisitions = new Set(state.recentAcquisitions.map((a) => a.id));
    app.innerHTML = `
      <div class="overlay" style="position:relative;min-height:100dvh;background:none;backdrop-filter:none">
        <div class="rays ${r.monster.rarity === 'rare' ? 'gold' : r.monster.rarity === 'secret' ? 'purple' : ''}"></div>
        <p class="display pop glow-o" style="font-size:34px">${r.monster.rarity === 'rare' ? 'RARE MONSTER FOUND!!' : r.monster.rarity === 'secret' ? 'SECRET MONSTER DISCOVERED' : 'MONSTER GET!'}</p>
        <div class="float" style="margin:28px 0">${face(r.monster, 170)}</div>
        <p class="display" style="font-size:22px">${r.sourceName ? esc(r.sourceName) + 'さんの' : ''}${esc(r.monster.name)}をGET！</p>
        ${r.openedPositions.length ? '<p class="muted" style="margin-top:8px">🎃 ビンゴのマスがOPEN！</p>' : ''}
        ${r.bingoLinesAfter > r.bingoLinesBefore ? '<p class="display title-grad" style="font-size:52px;margin-top:10px">BINGO!!</p>' : ''}
        <button class="btn" id="toCard" style="max-width:300px;margin-top:30px">カードを見る</button>
      </div>`;
    document.getElementById('toCard').onclick = () => { tab = 'bingo'; startGame(); };
  }

  // ================================================================ シェア画像（9:16、名前は描かない）
  async function shareImage() {
    const s = state.stats;
    const W = 1080, H = 1920;
    const FONT = '"Dela Gothic One", "Hiragino Sans", sans-serif';
    if (document.fonts) await document.fonts.load(`80px ${FONT}`).catch(() => {});
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1d1238'); bg.addColorStop(0.55, '#0b0a10'); bg.addColorStop(1, '#2a1406');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.random() * 0.6})`; ctx.beginPath(); ctx.arc(Math.random() * W, Math.random() * H * 0.6, Math.random() * 2.2, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#ffe8c2'; ctx.shadowColor = 'rgba(255,200,120,.8)'; ctx.shadowBlur = 60; ctx.beginPath(); ctx.arc(860, 230, 90, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.textAlign = 'center';
    const text = (t, y, size, color, glow) => { ctx.font = `${size}px ${FONT}`; ctx.shadowColor = glow; ctx.shadowBlur = 40; ctx.fillStyle = color; ctx.fillText(t, W / 2, y); ctx.shadowBlur = 0; };
    text('🎃 MONSTER BINGO 🎃', 250, 72, '#fff', 'rgba(174,123,255,.9)');
    const g = ctx.createLinearGradient(0, 330, 0, 470); g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#ffb870'); g.addColorStop(1, '#ff7a1a');
    ctx.font = `${s.cardCompleted ? 120 : 150}px ${FONT}`; ctx.shadowColor = 'rgba(255,122,26,.9)'; ctx.shadowBlur = 50; ctx.fillStyle = g;
    ctx.fillText(s.cardCompleted ? 'ALL COMPLETE' : s.bingoLines ? `${s.bingoLines} BINGO!!` : `${s.openedCells} OPEN`, W / 2, 470); ctx.shadowBlur = 0;
    const gw = 760, gap = 14, cs = (gw - gap * 4) / 5, gl = (W - gw) / 2, gt = 560;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(gl - 30, gt - 30, gw + 60, gw + 60);
    state.card.cells.forEach((c) => {
      const x = gl + (c.position % 5) * (cs + gap), y = gt + Math.floor(c.position / 5) * (cs + gap);
      ctx.fillStyle = c.isOpen ? (c.monster ? safeColor(c.monster.color) : '#ff7a1a') : '#1b1826'; ctx.fillRect(x, y, cs, cs);
      ctx.globalAlpha = c.isOpen ? 1 : 0.25; ctx.font = `${cs * 0.58}px sans-serif`; ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
      ctx.fillText(c.monster ? c.monster.emoji : '🎃', x + cs / 2, y + cs / 2 + 6); ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
    });
    text(`${s.speciesFound} MONSTERS FOUND`, 1490, 72, '#fff', 'rgba(255,122,26,.8)');
    ctx.font = `44px ${FONT}`; ctx.fillStyle = '#c9a6ff'; ctx.fillText(`${s.encounterPeople} PEOPLE MET · ${s.completionRate}% COMPLETE`, W / 2, 1570);
    text('HALLOWEEN NIGHT', 1720, 64, '#ffb870', 'rgba(255,122,26,.7)');
    ctx.font = `40px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText(state.event.name, W / 2, 1790);

    const blob = await new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
    const file = new File([blob], 'monster-bingo.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'MONSTER BINGO' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const el = overlay(`<p class="display" style="font-size:20px">ストーリー用画像</p><img src="${url}" alt="MONSTER BINGO の結果画像" style="width:220px;max-width:100%;border-radius:16px;margin-top:16px;box-shadow:0 20px 50px rgba(0,0,0,.7)"><p class="muted" style="margin-top:14px">画像を長押しして保存してね</p><button class="btn-ghost" id="closeShare" style="max-width:300px;margin-top:16px">閉じる</button>`);
    el.querySelector('#closeShare').onclick = () => { el.remove(); URL.revokeObjectURL(url); };
  }

  // アプリの外枠（HTML・画像・ライブラリ）だけを端末に保存し、電波が切れても画面が開くようにする。
  //   Supabase への問い合わせは sw.js 側で素通しにしている（役割や状態を端末に残さないため）
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  boot();
})();
</script>
